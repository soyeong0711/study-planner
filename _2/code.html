<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>월간 플래너 | Woolini</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bubbly-shadow {
            box-shadow: 0 4px 20px rgba(53, 103, 97, 0.08);
        }
        .bubbly-button {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 2px 0 #2a524d;
        }
        .bubbly-button:active {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 0px 0 #2a524d;
            transform: translateY(2px);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .bottom-sheet-anim {
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.7);
        }
        body {
            min-height: 100dvh;
        }
        .calendar-btn-pulse:active {
            transform: scale(0.92);
        }
    </style>

                        "on-tertiary-fixed-variant": "#4e471f",

                        "on-tertiary-container": "#5f582e",

                        "on-primary": "#ffffff",

                        "secondary-container": "#e9d9ff",
                        "primary-fixed": "#b9ede5",

                    "spacing": {
                        "unit": "8px",

</head>
<body class="bg-background text-on-surface font-body-md min-h-screen">
<!-- Top AppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md flex items-center justify-between px-container-padding-mobile md:px-container-padding-desktop h-16">
<div class="flex items-center gap-4">
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-200 p-2 rounded-full hover:bg-surface-container-high" onclick="window.history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary font-bold">Study Planner</h1>
</div>
<div class="flex items-center gap-2">
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</button>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-container">
<img alt="프로필" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAL7pl4zo3S5ns-o-IQp1FW_FNeH4JNl2e17Y55WQLVloGJWyPd9QAaITZh2aNHwLGSRJpYy16uKevBs3ccUc5ETPxrfb6pJRBKDOVdkCMxiWAGIw-E3Q_XXrJLvxGrWezytHz_Rmj9b5X2W3oSH7xeGEHGjhym1K5ZETUK8Fo4iWuIv0I-49l5_TYd8eaVQdaWkirZYUv7cKL9mYiqSqG530T6nJwVlZ6hHncdvTO_FEHUkxUEfJUhol9P7Vp11o3PPhzgGDp2Rj8"/>
</div>
</div>
</header>
<main class="pt-20 pb-32 px-4 md:px-container-padding-desktop max-w-6xl mx-auto">
<!-- Month Selector & Controls -->
<section class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
<div class="flex items-center gap-4">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-secondary">2024년 9월</h2>
<div class="flex gap-2">
<button class="p-2 rounded-full bg-secondary-container text-on-secondary-container hover:scale-105 transition-transform bubbly-shadow">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<button class="p-2 rounded-full bg-secondary-container text-on-secondary-container hover:scale-105 transition-transform bubbly-shadow">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</div>
<div class="flex items-center gap-3">
<button class="bg-primary text-on-primary px-5 py-2.5 rounded-full font-interactive text-interactive bubbly-button flex items-center gap-2" onclick="openBottomSheet(5)">
<span class="material-symbols-outlined text-[20px]">add</span>
<span class="text-sm md:text-base">새 일정 추가</span>
</button>
<div class="hidden md:flex bg-surface-container-high p-1 rounded-full">
<button class="px-4 py-2 rounded-full text-on-surface-variant font-label-bold">주간</button>
<button class="px-6 py-2 rounded-full bg-surface-container-lowest text-primary font-label-bold shadow-sm">월간</button>
</div>
</div>
</section>
<!-- Calendar Container -->
<div class="relative w-full overflow-hidden">
<div class="bg-surface-container-lowest rounded-xl p-3 md:p-8 bubbly-shadow">
<!-- Day Names -->
<div class="calendar-grid mb-3 md:mb-4">
<div class="text-center font-label-bold text-error/60 pb-1 text-xs md:text-sm">일</div>
<div class="text-center font-label-bold text-on-surface-variant/60 pb-1 text-xs md:text-sm">월</div>
<div class="text-center font-label-bold text-on-surface-variant/60 pb-1 text-xs md:text-sm">화</div>
<div class="text-center font-label-bold text-on-surface-variant/60 pb-1 text-xs md:text-sm">수</div>
<div class="text-center font-label-bold text-on-surface-variant/60 pb-1 text-xs md:text-sm">목</div>
<div class="text-center font-label-bold text-on-surface-variant/60 pb-1 text-xs md:text-sm">금</div>
<div class="text-center font-label-bold text-secondary/60 pb-1 text-xs md:text-sm">토</div>
</div>
<!-- Calendar Dates -->
<div class="calendar-grid gap-2 md:gap-4" id="calendar-days">
<!-- Placeholder: Last month tail -->
<div class="aspect-square p-1 md:p-2 rounded-xl text-on-surface-variant/20 flex items-start justify-end font-label-bold text-xs md:text-sm">25</div>
<div class="aspect-square p-1 md:p-2 rounded-xl text-on-surface-variant/20 flex items-start justify-end font-label-bold text-xs md:text-sm">26</div>
<div class="aspect-square p-1 md:p-2 rounded-xl text-on-surface-variant/20 flex items-start justify-end font-label-bold text-xs md:text-sm">27</div>
<div class="aspect-square p-1 md:p-2 rounded-xl text-on-surface-variant/20 flex items-start justify-end font-label-bold text-xs md:text-sm">28</div>
<div class="aspect-square p-1 md:p-2 rounded-xl text-on-surface-variant/20 flex items-start justify-end font-label-bold text-xs md:text-sm">29</div>
<div class="aspect-square p-1 md:p-2 rounded-xl text-on-surface-variant/20 flex items-start justify-end font-label-bold text-xs md:text-sm">30</div>
<div class="aspect-square p-1 md:p-2 rounded-xl text-on-surface-variant/20 flex items-start justify-end font-label-bold text-xs md:text-sm">31</div>
<!-- Current Month: Iterative Buttons -->
<script>
                        const daysInMonth = 30;
                        const calendarDays = document.getElementById('calendar-days');
                        for (let i = 1; i <= daysInMonth; i++) {
                            const isToday = i === 5;
                            const hasDot = [1, 3, 8].includes(i);
                            const dotColor = i === 1 ? 'bg-tertiary' : (i === 3 ? 'bg-secondary' : 'bg-secondary-container');
                            
                            const btn = document.createElement('button');
                            btn.className = `calendar-btn-pulse group aspect-square p-1 md:p-2 rounded-xl transition-all flex flex-col items-end gap-1 relative overflow-hidden border ${isToday ? 'bg-primary text-on-primary ring-2 ring-primary-container/30 border-primary' : 'bg-surface-container-low hover:bg-primary-container/30 border-transparent hover:border-primary-container'}`;
                            btn.onclick = () => openBottomSheet(i);
                            
                            let content = `<span class="font-label-bold text-xs md:text-sm ${isToday ? 'text-on-primary' : 'text-on-surface-variant'}">${i}</span>`;
                            if (isToday) {
                                content += `<div class="mt-auto text-[8px] md:text-[10px] bg-white/20 px-1.5 md:px-2 py-0.5 rounded-full whitespace-nowrap">오늘</div>`;
                            } else if (hasDot) {
                                if (i === 8) {
                                    content += `<div class="w-full flex justify-center mt-auto pb-1"><span class="w-full h-1 ${dotColor} rounded-full mx-1 md:mx-2"></span></div>`;
                                } else {
                                    content += `<div class="w-full flex justify-center mt-auto pb-0.5"><span class="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full ${dotColor}"></span></div>`;
                                }
                            }
                            btn.innerHTML = content;
                            calendarDays.appendChild(btn);
                        }
                    </script>
</div>
</div>
</div>
</main>
<!-- Bottom Sheet UI -->
<div class="fixed inset-0 z-[100] hidden bg-inverse-surface/40 backdrop-blur-sm transition-opacity duration-300 opacity-0" id="bottom-sheet-overlay">
<div class="fixed bottom-0 left-0 right-0 max-w-2xl mx-auto bg-surface rounded-t-xl bubbly-shadow bottom-sheet-anim p-6 pb-10" id="bottom-sheet">
<!-- Handle -->
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full mx-auto mb-6" onclick="closeBottomSheet()"></div>
<div class="flex justify-between items-start mb-6">
<div>
<h3 class="font-headline-lg-mobile text-primary flex items-center gap-2">
<span id="sheet-date-text">9월 5일</span> 일정 관리
                    </h3>
<p class="text-on-surface-variant text-sm mt-1">오늘의 학습과 개인 일정을 관리하세요.</p>
</div>
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors" onclick="closeBottomSheet()">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Schedule List -->
<div class="space-y-3 mb-8">
<div class="flex items-center justify-between p-4 bg-primary-container/10 border border-primary-container/20 rounded-xl group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container/30 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">book</span>
</div>
<div>
<p class="font-label-bold text-on-surface text-sm">토익 영단어 100개 암기</p>
<p class="text-on-surface-variant text-xs">오전 10:00 - 11:30</p>
</div>
</div>
<button class="p-2 text-error/40 hover:text-error hover:bg-error-container/20 rounded-full transition-all" title="삭제">
<span class="material-symbols-outlined text-[20px]">delete_outline</span>
</button>
</div>
<div class="flex items-center justify-between p-4 bg-secondary-container/10 border border-secondary-container/20 rounded-xl">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container/30 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">exercise</span>
</div>
<div>
<p class="font-label-bold text-on-surface text-sm">저녁 조깅 (공원 3바퀴)</p>
<p class="text-on-surface-variant text-xs">오후 07:00 - 08:00</p>
</div>
</div>
<button class="p-2 text-error/40 hover:text-error hover:bg-error-container/20 rounded-full transition-all">
<span class="material-symbols-outlined text-[20px]">delete_outline</span>
</button>
</div>
<div class="p-4 border-2 border-dashed border-outline-variant/30 rounded-xl flex items-center justify-center text-on-surface-variant/50 gap-2 hover:bg-surface-container-low transition-colors cursor-pointer">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
<span class="font-label-bold text-sm">등록된 다른 일정이 없습니다.</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-3">
<button class="flex-1 px-4 py-3.5 rounded-full font-interactive text-on-surface-variant bg-surface-container-highest hover:bg-surface-dim transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">delete</span>
<span>전체 삭제</span>
</button>
<button class="flex-[2] px-4 py-3.5 rounded-full font-interactive text-on-primary bg-primary bubbly-button transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">add</span>
<span>새 일정 추가</span>
</button>
</div>
</div>
</div>
<script>
        function openBottomSheet(day) {
            const overlay = document.getElementById('bottom-sheet-overlay');
            const sheet = document.getElementById('bottom-sheet');
            const dateText = document.getElementById('sheet-date-text');
            
            dateText.innerText = `9월 ${day}일`;
            
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                overlay.classList.add('opacity-100');
            }, 10);
        }

        function closeBottomSheet() {
            const overlay = document.getElementById('bottom-sheet-overlay');
            overlay.classList.remove('opacity-100');
            overlay.classList.add('opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }

        document.getElementById('bottom-sheet-overlay').addEventListener('click', function(e) {
            if(e.target === this) closeBottomSheet();
        });
    </script>
</body></html>
