<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Mascot</title>
<style>
  :root { --scale: 0.32; }      /* 캐릭터 크기 조절: 이 값만 바꾸면 됨 */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:transparent; }
  .wrap {
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%;
  }
  /* 원본 좌표계(696x1018)를 그대로 두고 통째로 scale */
  .stage {
    position:relative;
    width:696px; height:1018px;
    transform: scale(var(--scale));
    transform-origin:center center;
    animation: bob 1.8s ease-in-out infinite alternate;
  }
  .part { position:absolute; user-select:none; -webkit-user-drag:none; }

  /* 다리 살짝 */
  #legLeft  { animation: legL 1.4s ease-in-out infinite alternate; }
  #legRight { animation: legR 1.4s ease-in-out infinite alternate; }
  /* 눈 깜빡임 */
  #eyes { animation: blink 2.2s ease-in-out infinite; }

  @keyframes legL { from {transform:rotate(0deg);} to {transform:rotate(5deg);} }
  @keyframes legR { from {transform:rotate(0deg);} to {transform:rotate(-5deg);} }
  @keyframes bob  { from {transform:scale(var(--scale)) translateY(0);}
                     to   {transform:scale(var(--scale)) translateY(-18px);} }
  @keyframes blink {
    0%, 85%, 100% { transform: scaleY(1); }
    90%           { transform: scaleY(0.08); }
    94%           { transform: scaleY(1); }
  }
</style>
