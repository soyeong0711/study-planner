<script>
    let settings = {
        username: "초보 탐험가",
        goalHours: "4시간 30분",
        avatarUrl: "https://lh3.googleusercontent.com/aida-public/AB6AXuAL7pl4zo3S5ns-o-IQp1FW_FNeH4JNl2e17Y55WQLVloGJWyPd9QAaITZh2aNHwLGSRJpYy16uKevBs3ccUc5ETPxrfb6pJRBKDOVdkCMxiWAGIw-E3Q_XXrJLvxGrWezytHz_Rmj9b5X2W3oSH7xeGEHGjhym1K5ZETUK8Fo4iWuIv0I-49l5_TYd8eaVQdaWkirZYUv7cKL9mYiqSqG530T6nJwVlZ6hHncdvTO_FEHUkxUEfJUhol9P7Vp11o3PPhzgGDp2Rj8",
        themeColor: "mint",
        bgMode: "light",
        cardRoundness: "standard",
        soundEnabled: true,
        popupEnabled: true
    };

    let calendarNotes = {};
    let calendarMoods = {};

    let currentYear = 2026;
    let currentMonth = 5; // 6월 (0: 1월, 5: 6월)
    let currentPlannerCalendarView = 'month'; // 'month' or 'week'
    
    let selectedDay = null;
    let selectedMood = 'calm';

    function hexToRgb(hex) {
        const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
        hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '0, 0, 0';
    }
    
    function darkenColor(hex) {
        const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
        hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        if (!result) return '#1b4e4a';
        let r = Math.max(0, parseInt(result[1], 16) - 30);
        let g = Math.max(0, parseInt(result[2], 16) - 30);
        let b = Math.max(0, parseInt(result[3], 16) - 30);
        return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
    }

    function applyActiveThemeColors() {
        let primaryHex = '#356761';
        let secondaryHex = '#655978';
        let primaryContainerHex = '#a5d8d1';
        let secondaryContainerHex = '#e9d9ff';
        let onPrimaryContainerHex = '#2e605a';
        let onSecondaryContainerHex = '#6a5d7d';
        
        if (settings.themeColor === 'lavender') {
            primaryHex = '#655978';
            secondaryHex = '#356761';
            primaryContainerHex = '#e9d9ff';
            secondaryContainerHex = '#a5d8d1';
            onPrimaryContainerHex = '#6a5d7d';
            onSecondaryContainerHex = '#2e605a';
        } else if (settings.themeColor === 'yellow') {
            primaryHex = '#a3974d';
            secondaryHex = '#655978';
            primaryContainerHex = '#f5eeb3';
            secondaryContainerHex = '#e9d9ff';
            onPrimaryContainerHex = '#5f582e';
            onSecondaryContainerHex = '#6a5d7d';
        } else if (settings.themeColor === 'skyblue') {
            primaryHex = '#3a86c8';
            secondaryHex = '#d65a88';
            primaryContainerHex = '#bfe2fc';
            secondaryContainerHex = '#fcd3e1';
            onPrimaryContainerHex = '#184e7a';
            onSecondaryContainerHex = '#701a3e';
        } else if (settings.themeColor === 'softpink') {
            primaryHex = '#d65a88';
            secondaryHex = '#2d7a4d';
            primaryContainerHex = '#fcd3e1';
            secondaryContainerHex = '#b8ebd0';
            onPrimaryContainerHex = '#701a3e';
            onSecondaryContainerHex = '#124f2b';
        } else if (settings.themeColor === 'forest') {
            primaryHex = '#2d7a4d';
            secondaryHex = '#3a86c8';
            primaryContainerHex = '#b8ebd0';
            secondaryContainerHex = '#bfe2fc';
            onPrimaryContainerHex = '#124f2b';
            onSecondaryContainerHex = '#184e7a';
        }
        
        let styleEl = document.getElementById('dynamic-theme-colors');
        if (!styleEl) {
            styleEl = document.createElement('style');
            styleEl.id = 'dynamic-theme-colors';
            document.head.appendChild(styleEl);
        }
        
        styleEl.innerHTML = `
            .text-primary { color: ${primaryHex} !important; }
            .bg-primary { background-color: ${primaryHex} !important; }
            .border-primary { border-color: ${primaryHex} !important; }
            .ring-primary { --tw-ring-color: ${primaryHex} !important; }
            
            .text-secondary { color: ${secondaryHex} !important; }
            .bg-secondary { background-color: ${secondaryHex} !important; }
            .border-secondary { border-color: ${secondaryHex} !important; }
            .ring-secondary { --tw-ring-color: ${secondaryHex} !important; }
            
            .bg-primary-container { background-color: ${primaryContainerHex} !important; }
            .bg-primary-container\\/20 { background-color: rgba(${hexToRgb(primaryContainerHex)}, 0.2) !important; }
            .text-on-primary-container { color: ${onPrimaryContainerHex} !important; }
            
            .bg-secondary-container { background-color: ${secondaryContainerHex} !important; }
            .bg-secondary-container\\/20 { background-color: rgba(${hexToRgb(secondaryContainerHex)}, 0.2) !important; }
            .bg-secondary-container\\/40 { background-color: rgba(${hexToRgb(secondaryContainerHex)}, 0.4) !important; }
            .text-on-secondary-container { color: ${onSecondaryContainerHex} !important; }
            
            .text-primary-fixed { color: ${primaryContainerHex} !important; }
            .bg-primary-fixed { background-color: ${primaryContainerHex} !important; }
            .text-secondary-fixed { color: ${secondaryContainerHex} !important; }
            .bg-secondary-fixed { background-color: ${secondaryContainerHex} !important; }
            
            .bubbly-button { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 2px 0 ${darkenColor(primaryHex)} !important; }
            .bubbly-button:active { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 0px 0 ${darkenColor(primaryHex)} !important; }
        `;
    }

    function applyActiveBackgroundMode() {
        const html = document.documentElement;
        if (settings.bgMode === 'dark') {
            html.className = 'dark';
            document.body.className = 'bg-inverse-surface font-body-md text-inverse-on-surface min-h-screen selection:bg-primary-container selection:text-on-primary-container';
        } else {
            html.className = 'light';
            document.body.className = 'bg-surface font-body-md text-on-surface min-h-screen selection:bg-primary-container selection:text-on-primary-container';
        }
    }

    function applyActiveCardRoundness() {
        let roundedLgClass = '2rem';
        let rounded2xlClass = '1.5rem';
        let roundedXlClass = '1.25rem';
        
        if (settings.cardRoundness === 'squircle') {
            roundedLgClass = '0.5rem';
            rounded2xlClass = '0.375rem';
            roundedXlClass = '0.375rem';
        } else if (settings.cardRoundness === 'pill') {
            roundedLgClass = '3rem';
            rounded2xlClass = '1.75rem';
            roundedXlClass = '2rem';
        }
        
        let styleEl = document.getElementById('dynamic-theme-roundness');
        if (!styleEl) {
            styleEl = document.createElement('style');
            styleEl.id = 'dynamic-theme-roundness';
            document.head.appendChild(styleEl);
        }
        
        styleEl.innerHTML = `
            .rounded-lg { border-radius: ${roundedLgClass} !important; }
            .rounded-xl { border-radius: ${roundedXlClass} !important; }
            .rounded-2xl { border-radius: ${rounded2xlClass} !important; }
            .widget-card { border-radius: ${roundedLgClass} !important; }
            #modal-content { border-radius: ${roundedLgClass} !important; }
            .rounded-full { border-radius: 9999px !important; }
        `;
    }

    function loadSettingsState() {
        try {
            const saved = localStorage.getItem('woolini_settings');
            if (saved) {
                settings = JSON.parse(saved);
            }
        } catch(e) {
            console.error("Failed to load settings state: ", e);
        }
    }

    function loadCalendarData() {
        try {
            const savedNotes = localStorage.getItem('woolini_calendar_notes');
            if (savedNotes) {
                calendarNotes = JSON.parse(savedNotes);
            }
            const savedMoods = localStorage.getItem('woolini_calendar_moods');
            if (savedMoods) {
                calendarMoods = JSON.parse(savedMoods);
            }
        } catch(e) {
            console.error("Failed to load calendar data: ", e);
        }
    }

    function saveCalendarData() {
        try {
            localStorage.setItem('woolini_calendar_notes', JSON.stringify(calendarNotes));
            localStorage.setItem('woolini_calendar_moods', JSON.stringify(calendarMoods));
        } catch(e) {
            console.error("Failed to save calendar data: ", e);
        }
    }

    const MASCOT_IMAGES = {
        'woolini': 'https://lh3.googleusercontent.com/aida-public/AB6AXuAL7pl4zo3S5ns-o-IQp1FW_FNeH4JNl2e17Y55WQLVloGJWyPd9QAaITZh2aNHwLGSRJpYy16uKevBs3ccUc5ETPxrfb6pJRBKDOVdkCMxiWAGIw-E3Q_XXrJLvxGrWezytHz_Rmj9b5X2W3oSH7xeGEHGjhym1K5ZETUK8Fo4iWuIv0I-49l5_TYd8eaVQdaWkirZYUv7cKL9mYiqSqG530T6nJwVlZ6hHncdvTO_FEHUkxUEfJUhol9P7Vp11o3PPhzgGDp2Rj8', // 초록 용 (울리니)
        'yang-i': 'https://img.icons8.com/color/150/sheep.png', // 양양이
        'gom-i': 'https://img.icons8.com/color/150/teddy-bear.png', // 곰곰이
        'mong-i': 'https://img.icons8.com/color/150/monkey.png' // 몽이
    };

    function applySettingsToUI() {
        // Update profile avatar inside header using dedicated id
        const headerAvatar = document.getElementById('header-profile-avatar');
        if (headerAvatar) headerAvatar.src = settings.avatarUrl;
        
        // Update active mascot image
        const mascotImg = document.querySelector('.floating-anim img');
        if (mascotImg) {
            const activeMascot = settings.activeMascot || 'woolini';
            mascotImg.src = MASCOT_IMAGES[activeMascot];
        }

        // Mascot Speech Bubble text update if Gom-i, Mong-i etc.
        const floatingEl = document.querySelector('.floating-anim');
        if (floatingEl && floatingEl.nextElementSibling) {
            const mascotSpeech = floatingEl.nextElementSibling.querySelector('p');
            if (mascotSpeech) {
                const speeches = {
                    'woolini': '"주말에는 푹 쉬어주세요!" 🐉',
                    'yang-i': '"주말에는 푹 쉬어주세요!" 🐑',
                    'gom-i': '"주말에는 푹 쉬어주세요!" 🐻',
                    'mong-i': '"주말에는 푹 쉬어주세요!" 🐒'
                };
                const activeMascot = settings.activeMascot || 'woolini';
                mascotSpeech.innerText = speeches[activeMascot];
            }
        }
        
        applyActiveThemeColors();
        applyActiveBackgroundMode();
        applyActiveCardRoundness();
    }

    function prevMonth() {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        updateMonthLabel();
        renderPlannerCalendar();
    }

    function nextMonth() {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        updateMonthLabel();
        renderPlannerCalendar();
    }

    function updateMonthLabel() {
        const label = document.getElementById('planner-month-label');
        if (label) {
            label.innerText = `${currentYear}년 ${currentMonth + 1}월`;
        }
    }

    function setPlannerCalendarView(view) {
        currentPlannerCalendarView = view;
        const weekBtn = document.getElementById('planner-btn-week');
        const monthBtn = document.getElementById('planner-btn-month');
        if (view === 'week') {
            weekBtn.className = 'px-4 py-2 rounded-full bg-surface-container-lowest text-primary font-label-bold shadow-sm';
            monthBtn.className = 'px-6 py-2 rounded-full text-on-surface-variant font-label-bold hover:text-primary transition-colors';
        } else {
            monthBtn.className = 'px-6 py-2 rounded-full bg-surface-container-lowest text-primary font-label-bold shadow-sm';
            weekBtn.className = 'px-4 py-2 rounded-full text-on-surface-variant font-label-bold hover:text-primary transition-colors';
        }
        renderPlannerCalendar();
    }

    function getMoodEmoji(moodKey) {
        if (moodKey === 'happy') return '😊';
        if (moodKey === 'calm') return '😐';
        if (moodKey === 'tired') return '😴';
        if (moodKey === 'focus') return '📝';
        if (moodKey === 'passionate') return '🔥';
        return '';
    }

    function renderPlannerCalendar() {
        const container = document.getElementById('calendar-days');
        if (!container) return;
        container.innerHTML = '';
        
        // 2026-06-02 is defined as Today based on environment constraints
        const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
        const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
        const prevTotalDays = new Date(currentYear, currentMonth, 0).getDate();
        
        if (currentPlannerCalendarView === 'month') {
            // Previous Month's tail cells
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const day = prevTotalDays - i;
                const cell = document.createElement('div');
                cell.className = 'aspect-square p-1.5 md:p-2 rounded-lg text-on-surface-variant/20 flex items-start justify-end font-label-bold text-xs md:text-sm bg-surface-container-low/30 border border-surface-variant/10';
                cell.innerText = day;
                container.appendChild(cell);
            }
            
            // Current Month's active cells
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('button');
                const isToday = (currentYear === 2026 && currentMonth === 5 && day === 2);
                const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                const hasNote = calendarNotes[dateKey];
                const moodKey = calendarMoods[dateKey];
                const moodEmoji = getMoodEmoji(moodKey);
                
                let cellClass = '';
                if (isToday) {
                    cellClass = 'group aspect-square p-1.5 md:p-2 rounded-lg bg-primary text-on-primary bubbly-shadow transition-all flex flex-col items-stretch justify-between ring-2 md:ring-4 ring-primary-container/30 active:scale-95 text-left border border-primary';
                } else {
                    cellClass = 'group aspect-square p-1.5 md:p-2 rounded-lg bg-surface-container-low hover:bg-primary-container/10 transition-all border border-surface-variant/40 hover:border-primary-container/60 flex flex-col items-stretch justify-between active:scale-95 text-left';
                }
                cell.className = cellClass;
                
                let dayClass = isToday ? 'font-label-bold text-xs md:text-sm text-on-primary' : 'font-label-bold text-on-surface-variant text-xs md:text-sm';
                let innerHTML = `
                    <div class="flex justify-between items-center w-full">
                        <span class="${dayClass}">${day}</span>
                        ${moodEmoji ? `<span class="text-xs md:text-sm filter drop-shadow-sm">${moodEmoji}</span>` : ''}
                    </div>
                `;
                
                let bottomHTML = '';
                if (isToday && !hasNote) {
                    bottomHTML = `<div class="w-full text-right"><span class="text-[8px] md:text-[9px] bg-white/20 px-1 md:px-1.5 py-0.5 rounded-full text-on-primary font-bold">오늘</span></div>`;
                } else if (hasNote) {
                    const noteText = hasNote.replace(/\n/g, ' ');
                    const textClass = isToday ? 'text-white/90 bg-white/10' : 'text-primary bg-primary/10';
                    bottomHTML = `
                        <div class="w-full text-[9px] md:text-[10px] truncate ${textClass} px-1 md:px-1.5 py-0.5 rounded text-left font-medium max-w-full">
                            ${noteText}
                        </div>
                    `;
                } else {
                    bottomHTML = `<div></div>`;
                }
                
                innerHTML += bottomHTML;
                cell.innerHTML = innerHTML;
                
                cell.onclick = () => openModal(day);
                container.appendChild(cell);
            }
            
            // Next Month's head cells
            const currentTotalCells = firstDayIndex + totalDays;
            let nextMonthCellsCount = 42 - currentTotalCells;
            if (currentTotalCells <= 35) {
                nextMonthCellsCount = 35 - currentTotalCells;
            } else {
                nextMonthCellsCount = 42 - currentTotalCells;
            }
            
            for (let day = 1; day <= nextMonthCellsCount; day++) {
                const cell = document.createElement('div');
                cell.className = 'aspect-square p-1.5 md:p-2 rounded-lg text-on-surface-variant/20 flex items-start justify-end font-label-bold text-xs md:text-sm bg-surface-container-low/30 border border-surface-variant/10';
                cell.innerText = day;
                container.appendChild(cell);
            }
        } else {
            // Weekly View dynamic render:
            // Find reference date (Today 2nd if June 2026, otherwise 1st of that month)
            const refDay = (currentYear === 2026 && currentMonth === 5) ? 2 : 1;
            const refDateIndex = new Date(currentYear, currentMonth, refDay).getDay();
            const startDayOffset = refDay - refDateIndex;
            
            for (let i = 0; i < 7; i++) {
                const targetDate = new Date(currentYear, currentMonth, startDayOffset + i);
                const tYear = targetDate.getFullYear();
                const tMonth = targetDate.getMonth();
                const tDay = targetDate.getDate();
                
                const isToday = (tYear === 2026 && tMonth === 5 && tDay === 2);
                const isCurrentMonth = (tMonth === currentMonth);
                const dateKey = `${tYear}-${String(tMonth + 1).padStart(2, '0')}-${String(tDay).padStart(2, '0')}`;
                
                const hasNote = calendarNotes[dateKey];
                const moodKey = calendarMoods[dateKey];
                const moodEmoji = getMoodEmoji(moodKey);
                
                if (!isCurrentMonth) {
                    const cell = document.createElement('div');
                    cell.className = 'aspect-square p-1.5 md:p-2 rounded-lg text-on-surface-variant/20 flex items-start justify-end font-label-bold text-xs md:text-sm bg-surface-container-low/30 border border-surface-variant/10';
                    cell.innerText = tDay;
                    container.appendChild(cell);
                } else {
                    const cell = document.createElement('button');
                    let cellClass = '';
                    if (isToday) {
                        cellClass = 'group aspect-square p-1.5 md:p-2 rounded-lg bg-primary text-on-primary bubbly-shadow transition-all flex flex-col items-stretch justify-between ring-2 md:ring-4 ring-primary-container/30 active:scale-95 text-left border border-primary';
                    } else {
                        cellClass = 'group aspect-square p-1.5 md:p-2 rounded-lg bg-surface-container-low hover:bg-primary-container/10 transition-all border border-surface-variant/40 hover:border-primary-container/60 flex flex-col items-stretch justify-between active:scale-95 text-left';
                    }
                    cell.className = cellClass;
                    
                    let dayClass = isToday ? 'font-label-bold text-xs md:text-sm text-on-primary' : 'font-label-bold text-on-surface-variant text-xs md:text-sm';
                    let innerHTML = `
                        <div class="flex justify-between items-center w-full">
                            <span class="${dayClass}">${tDay}</span>
                            ${moodEmoji ? `<span class="text-xs md:text-sm filter drop-shadow-sm">${moodEmoji}</span>` : ''}
                        </div>
                    `;
                    
                    let bottomHTML = '';
                    if (isToday && !hasNote) {
                        bottomHTML = `<div class="w-full text-right"><span class="text-[8px] md:text-[9px] bg-white/20 px-1 md:px-1.5 py-0.5 rounded-full text-on-primary font-bold">오늘</span></div>`;
                    } else if (hasNote) {
                        const noteText = hasNote.replace(/\n/g, ' ');
                        const textClass = isToday ? 'text-white/90 bg-white/10' : 'text-primary bg-primary/10';
                        bottomHTML = `
                            <div class="w-full text-[9px] md:text-[10px] truncate ${textClass} px-1 md:px-1.5 py-0.5 rounded text-left font-medium max-w-full">
                                ${noteText}
                            </div>
                        `;
                    } else {
                        bottomHTML = `<div></div>`;
                    }
                    
                    innerHTML += bottomHTML;
                    cell.innerHTML = innerHTML;
                    
                    cell.onclick = () => openModal(tDay);
                    container.appendChild(cell);
                }
            }
        }
    }

    function openModal(day) {
        selectedDay = day;
        const modal = document.getElementById('plan-modal');
        const content = document.getElementById('modal-content');
        const dateLabel = document.getElementById('selected-date');
        const noteInput = document.getElementById('calendar-note-input');
        const deleteBtn = document.getElementById('plan-delete-btn');
        
        const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        dateLabel.innerText = `${currentYear}년 ${currentMonth + 1}월 ${day}일`;
        dateLabel.setAttribute('data-key', dateKey);
        
        // Load note and mood if existing
        const existingNote = calendarNotes[dateKey] || '';
        noteInput.value = existingNote;
        
        const existingMood = calendarMoods[dateKey] || 'calm';
        setPlanMood(existingMood);
        
        // Show/hide delete button based on entry existence
        if (existingNote || calendarMoods[dateKey]) {
            deleteBtn.classList.remove('hidden');
        } else {
            deleteBtn.classList.add('hidden');
        }
        
        modal.classList.remove('hidden');
        setTimeout(() => {
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }, 10);
    }

    function closeModal() {
        const modal = document.getElementById('plan-modal');
        const content = document.getElementById('modal-content');
        
        content.classList.remove('scale-100');
        content.classList.add('scale-95');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 200);
    }

    function setPlanMood(mood) {
        selectedMood = mood;
        const moods = ['happy', 'calm', 'tired', 'focus', 'passionate'];
        
        moods.forEach(m => {
            const btn = document.getElementById(`mood-btn-${m}`);
            if (!btn) return;
            
            if (m === mood) {
                btn.className = `py-2 rounded-xl border-2 border-primary text-[11px] font-bold bg-primary-container/20 text-primary transition-all active:scale-95 flex flex-col items-center gap-0.5`;
                const textSpan = btn.querySelector('span:last-child');
                if (textSpan) textSpan.className = `text-[9px] text-primary`;
            } else {
                btn.className = `py-2 rounded-xl border border-surface-variant text-[11px] font-bold bg-surface-container-low transition-all active:scale-95 flex flex-col items-center gap-0.5 hover:border-primary/50`;
                const textSpan = btn.querySelector('span:last-child');
                if (textSpan) textSpan.className = `text-[9px] text-on-surface-variant/80`;
            }
        });
    }

    function saveCalendarPlan() {
        if (!selectedDay) return;
        
        const noteInput = document.getElementById('calendar-note-input');
        const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(selectedDay).padStart(2, '0')}`;
        const noteVal = noteInput.value.trim();
        
        if (noteVal) {
            calendarNotes[dateKey] = noteVal;
        } else {
            delete calendarNotes[dateKey];
        }
        
        if (selectedMood) {
            calendarMoods[dateKey] = selectedMood;
        } else {
            delete calendarMoods[dateKey];
        }
        
        saveCalendarData();
        renderPlannerCalendar();
        closeModal();
    }

    function deleteCalendarPlan() {
        if (!selectedDay) return;
        
        const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(selectedDay).padStart(2, '0')}`;
        
        delete calendarNotes[dateKey];
        delete calendarMoods[dateKey];
        
        saveCalendarData();
        renderPlannerCalendar();
        closeModal();
    }

    function openNewPlanModal() {
        let targetDay = 1;
        if (currentYear === 2026 && currentMonth === 5) {
            targetDay = 2; // Open for June 2nd if currently on June 2026
        }
        openModal(targetDay);
    }

    document.getElementById('plan-modal').addEventListener('click', function(e) {
        if(e.target === this) closeModal();
    });

    window.addEventListener('DOMContentLoaded', () => {
        loadSettingsState();
        loadCalendarData();
        applySettingsToUI();
        updateMonthLabel();
        renderPlannerCalendar();
    });
</script>
</body></html>
